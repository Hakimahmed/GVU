<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Crop & News Graphic Generator</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Urdu+Najd+V3&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Roboto', sans-serif;
  }

  body {
    background: #f4f6f8;
    padding: 30px;
    color: #333;
  }

  h1 {
    text-align: center;
    margin-bottom: 30px;
    color: #006163;
  }

  .container {
    max-width: 1280px;
    margin: 0 auto;
  }

  #canvasContainer, #newsCanvasContainer {
    background-color: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin-bottom: 30px;
    overflow: hidden;
    border: 1px solid #ccc;
  }

  #canvasContainer {
    width: 1200px;
    height: 720px;
  }

  #newsCanvasContainer {
    width: 1080px;
    height: 1080px;
  }

  canvas {
    display: block;
    margin: auto;
  }

  button {
    padding: 12px 24px;
    margin: 5px;
    border: none;
    border-radius: 6px;
    background-color: #006163;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background-color: #004d4d;
  }

  #headlineInput {
    width: 80%;
    padding: 12px;
    font-size: 30px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin: 20px auto;
    display: block;
    font-family: 'Urdu Najd V3', serif;
  }
</style>
</head>

<body>

<div class="container">
  <h1>Image Crop & News Graphic Generator</h1>

  <div id="canvasContainer">
    <canvas id="canvas" width="1200" height="720"></canvas>
  </div>

  <div class="controls">
    <button id="generateButton">Generate News Graphic</button>
  </div>

  <input type="text" id="headlineInput" placeholder="Enter headline">

  <div id="newsCanvasContainer">
    <canvas id="newsCanvas" width="1080" height="1080"></canvas>
  </div>

  <div class="download-buttons">
    <button id="downloadNewsButton">Download News Image</button>
  </div>
</div>

<script>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const newsCanvas = document.getElementById('newsCanvas');
const newsCtx = newsCanvas.getContext('2d');

const headlineInput = document.getElementById('headlineInput');

const backgroundImage = new Image();
backgroundImage.src = 'bg.jpg';

const logoImage = new Image();
logoImage.src = 'aaj-logo.png?v=' + new Date().getTime(); // FIX CACHE ISSUE

let image = null;
let offsetX = 0;
let offsetY = 0;
let scale = 1;

// ================= PASTE IMAGE =================
document.addEventListener('paste', (event) => {
  const items = event.clipboardData.items;
  for (let item of items) {
    if (item.type.includes('image')) {
      const blob = item.getAsFile();
      const reader = new FileReader();
      reader.onload = (e) => loadImage(e.target.result);
      reader.readAsDataURL(blob);
    }
  }
});

function loadImage(src) {
  image = new Image();
  image.onload = () => fitImage();
  image.src = src;
}

// ================= FIXED FIT (NO STRETCH) =================
function fitImage() {
  const canvasRatio = canvas.width / canvas.height;
  const imgRatio = image.width / image.height;

  if (imgRatio > canvasRatio) {
    scale = canvas.height / image.height;
  } else {
    scale = canvas.width / image.width;
  }

  offsetX = (canvas.width - image.width * scale) / 2;
  offsetY = (canvas.height - image.height * scale) / 2;

  drawImage();
}

function drawImage() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(image, offsetX, offsetY, image.width * scale, image.height * scale);
}

// ================= NEWS GENERATOR =================
function generateNewsCanvas() {

  const headline = headlineInput.value.trim();
  if (!headline) return;

  newsCtx.clearRect(0, 0, newsCanvas.width, newsCanvas.height);

  // background
  newsCtx.drawImage(backgroundImage, 0, 0, 1080, 1080);

  const tempImage = new Image();

  tempImage.onload = function () {

    // ================= FIXED ASPECT RATIO IMAGE =================
    const maxW = 1030;
    const maxH = 600;

    const ratio = Math.min(maxW / tempImage.width, maxH / tempImage.height);

    const w = tempImage.width * ratio;
    const h = tempImage.height * ratio;

    const x = (1080 - w) / 2;
    const y = 70 + (maxH - h) / 2;

    newsCtx.drawImage(tempImage, x, y, w, h);

    // ================= LOGO (TOP LEFT ON IMAGE) =================
    newsCtx.fillStyle = "rgba(0,0,0,0.35)";
    newsCtx.fillRect(x + 15, y + 15, 140, 140);

    newsCtx.drawImage(logoImage, x + 25, y + 25, 120, 120);

    // ================= HEADLINE =================
    drawText(headline, 540, 800, 900, 55);
  };

  tempImage.src = canvas.toDataURL();
}

// ================= TEXT =================
function drawText(text, x, y, maxWidth, size) {

  const words = text.split(" ");
  let line = [];
  let lines = [];

  newsCtx.font = `700 ${size}px Montserrat`;
  newsCtx.fillStyle = "#006163";

  for (let word of words) {

    let test = line.join(" ") + " " + word;

    if (newsCtx.measureText(test).width > maxWidth && line.length) {
      lines.push(line.join(" "));
      line = [word];
    } else {
      line.push(word);
    }
  }

  if (line.length) lines.push(line.join(" "));

  for (let i = 0; i < lines.length; i++) {
    const w = newsCtx.measureText(lines[i]).width;
    newsCtx.fillText(lines[i], x - w / 2, y + i * size * 1.2);
  }
}

// ================= EVENTS =================
document.getElementById("generateButton").onclick = generateNewsCanvas;

document.getElementById("downloadNewsButton").onclick = function () {
  const a = document.createElement("a");
  a.download = "news.png";
  a.href = newsCanvas.toDataURL("image/png");
  a.click();
};

</script>

</body>
</html>
