<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>GVU News Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

<style>

body{
  font-family: Arial;
  background:#f4f6f8;
  text-align:center;
  padding:20px;
}

h1{
  color:#006163;
}

#headlineInput{
  width:80%;
  padding:12px;
  font-size:20px;
  font-family:Montserrat;
  font-weight:700;
  margin:10px 0;
}

input[type="file"]{
  margin:15px 0;
}

button{
  padding:12px 18px;
  margin:5px;
  font-size:16px;
  cursor:pointer;
  border:none;
  background:#006163;
  color:white;
  border-radius:5px;
}

button:hover{
  opacity:0.9;
}

#canvasContainer{
  width:1080px;
  height:1350px;
  margin:auto;
  background:#fff;
  border:1px solid #ccc;
}

canvas{
  display:block;
}

</style>
</head>

<body>

<h1>GVU News Generator</h1>

<input type="file" id="imageInput" accept="image/*">
<br>

<input 
id="headlineInput" 
placeholder="Enter headline..." 
/>

<br>

<button id="generateBtn">Generate</button>
<button id="downloadBtn">Download</button>

<br><br>

<div id="canvasContainer">
  <canvas id="canvas" width="1080" height="1350"></canvas>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
  alpha:false
});

ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = "high";

const headlineInput = document.getElementById("headlineInput");
const imageInput = document.getElementById("imageInput");

// ================= IMAGES =================

// Background
const bg = new Image();
bg.src = "BG.png";

// Logo
const logo = new Image();
logo.src = "GVU.png";

// Uploaded image
let uploadedImage = null;

// ================= LOAD USER IMAGE =================

imageInput.addEventListener("change", function(e){

  const file = e.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(event){

    uploadedImage = new Image();

    uploadedImage.onload = function(){
      console.log("Image Loaded");
    };

    uploadedImage.src = event.target.result;
  };

  reader.readAsDataURL(file);

});

// ================= TEXT FUNCTION =================

function drawText(text, x, y, maxWidth, fontSize){

  const words = text.split(" ");

  let lines = [];
  let currentLine = "";

  ctx.font = `700 ${fontSize}px Montserrat`;
  ctx.fillStyle = "#000";
  ctx.textBaseline = "top";

  for(let i = 0; i < words.length; i++){

    let testLine = currentLine + words[i] + " ";

    let metrics = ctx.measureText(testLine);

    if(metrics.width > maxWidth && i > 0){

      lines.push(currentLine);

      currentLine = words[i] + " ";

    }else{

      currentLine = testLine;

    }
  }

  lines.push(currentLine);

  for(let i = 0; i < lines.length; i++){

    const lineWidth = ctx.measureText(lines[i]).width;

    ctx.fillText(
      lines[i],
      x - lineWidth / 2,
      y + (i * fontSize * 1.2)
    );
  }
}

// ================= GENERATE =================

function generate(){

  const headline = headlineInput.value.trim();

  if(!headline){
    alert("Enter headline");
    return;
  }

  if(!uploadedImage){
    alert("Upload image");
    return;
  }

  // CLEAR
  ctx.clearRect(0,0,1080,1350);

  // DRAW BACKGROUND
  ctx.drawImage(bg,0,0,1080,1350);

  // ================= IMAGE FIT =================

  const maxWidth = 1030;
  const maxHeight = 750;

  const ratio = Math.min(
    maxWidth / uploadedImage.width,
    maxHeight / uploadedImage.height
  );

  const drawWidth = uploadedImage.width * ratio;
  const drawHeight = uploadedImage.height * ratio;

  const imgX = (1080 - drawWidth) / 2;
  const imgY = 140 + ((maxHeight - drawHeight) / 2);

  // DRAW MAIN IMAGE
  ctx.drawImage(
    uploadedImage,
    imgX,
    imgY,
    drawWidth,
    drawHeight
  );

  // ================= LOGO BOX =================

  ctx.fillStyle = "rgba(0,0,0,0.35)";

  ctx.fillRect(
    imgX + 15,
    imgY + 15,
    140,
    140
  );

  // ================= LOGO =================

  ctx.drawImage(
    logo,
    imgX + 25,
    imgY + 25,
    120,
    120
  );

  // ================= HEADLINE =================

  drawText(
    headline,
    540,
    980,
    900,
    70
  );

}

// ================= BUTTONS =================

document.getElementById("generateBtn").onclick = generate;

// DOWNLOAD
document.getElementById("downloadBtn").onclick = function(){

  const link = document.createElement("a");

  link.download = "GVU-News.png";

  link.href = canvas.toDataURL("image/png");

  link.click();

};

</script>

</body>
</html>
