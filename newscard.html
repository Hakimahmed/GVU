<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: Arial;
    background: #f4f6f8;
    text-align: center;
    padding: 20px;
  }

  h1 {
    color: #006163;
  }

  #headlineInput {
    width: 80%;
    padding: 10px;
    font-size: 18px;
    font-family: Montserrat;
    font-weight: 700;
    margin: 10px 0;
  }

  button {
    padding: 10px 15px;
    margin: 5px;
    font-size: 16px;
    cursor: pointer;
  }

  #canvasContainer {
    width: 1080px;
    height: 1350px;
    margin: auto;
    background: #fff;
    border: 1px solid #ccc;
  }

  canvas {
    display: block;
  }
</style>
</head>

<body>

<h1>News Generator</h1>

<input id="headlineInput" placeholder="Enter headline (English only)" />
<br>

<button id="generateBtn">Generate</button>
<button id="downloadBtn">Download</button>

<div id="canvasContainer">
  <canvas id="canvas" width="1080" height="1350"></canvas>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const headlineInput = document.getElementById("headlineInput");

const bg = new Image();
bg.src = "BG.png";

const logo = new Image();
logo.src = "GVU.png";

// ================= TEXT =================
function drawText(text, x, y, maxWidth, size) {
  const words = text.split(" ");
  let line = [];
  let lines = [];

  ctx.font = `700 ${size}px Montserrat`;
  ctx.fillStyle = "#000";

  for (let word of words) {
    let test = line.join(" ") + (line.length ? " " : "") + word;

    if (ctx.measureText(test).width > maxWidth && line.length) {
      lines.push(line.join(" "));
      line = [word];
    } else {
      line.push(word);
    }
  }

  if (line.length) lines.push(line.join(" "));

  for (let i = 0; i < lines.length; i++) {
    let w = ctx.measureText(lines[i]).width;
    ctx.fillText(lines[i], x - w / 2, y + i * size * 1.2);
  }
}

// ================= GENERATE =================
function generate() {
  const text = headlineInput.value.trim();
  if (!text) return;

  ctx.clearRect(0, 0, 1080, 1350);

  // background
  ctx.drawImage(bg, 0, 0, 1080, 1350);

  const img = new Image();

  img.onload = function () {

    // NO STRETCH FIT IMAGE
    const maxW = 1030;
    const maxH = 750;

    let ratio = Math.min(maxW / img.width, maxH / img.height);

    let w = img.width * ratio;
    let h = img.height * ratio;

    let x = (1080 - w) / 2;
    let y = 140 + (maxH - h) / 2;

    ctx.drawImage(img, x, y, w, h);

    // headline
    drawText(text, 540, 950, 900, 70);

    // logo (safe top-right)
    ctx.drawImage(logo, 1080 - 150, 30, 110, 110);
  };

  img.src = canvas.toDataURL();
}

// ================= EVENTS =================
document.getElementById("generateBtn").onclick = generate;

document.getElementById("downloadBtn").onclick = function () {
  const a = document.createElement("a");
  a.download = "news.png";
  a.href = canvas.toDataURL();
  a.click();
};
</script>

</body>
</html>
