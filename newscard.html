<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Graphic Generator</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  body {
    background: #f4f6f8;
    padding: 20px;
    text-align: center;
  }

  h1 {
    margin-bottom: 20px;
    color: #006163;
  }

  #newsCanvasContainer {
    width: 1080px;
    height: 1350px;
    margin: auto;
    background: #fff;
    border: 1px solid #ccc;
    position: relative;
  }

  canvas {
    display: block;
    margin: auto;
  }

  .controls {
    margin: 15px 0;
  }

  button, select, input {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
  }

  #headlineInput {
    width: 80%;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
  }
</style>
</head>

<body>

<h1>News Graphic Generator</h1>

<!-- Template -->
<select id="templateSelect">
  <option value="classic">Classic News</option>
  <option value="breaking">Breaking News</option>
  <option value="minimal">Minimal Clean</option>
  <option value="dark">Dark Modern</option>
</select>

<br>

<input type="text" id="headlineInput" placeholder="Enter headline (English only)" />

<br>

<button id="generateButton">Generate News Graphic</button>
<button id="downloadButton">Download Image</button>

<div id="newsCanvasContainer">
  <canvas id="newsCanvas" width="1080" height="1350"></canvas>
</div>

<script>
const newsCanvas = document.getElementById('newsCanvas');
const newsCtx = newsCanvas.getContext('2d');

const headlineInput = document.getElementById('headlineInput');
const templateSelect = document.getElementById('templateSelect');

const generateButton = document.getElementById('generateButton');
const downloadButton = document.getElementById('downloadButton');

const backgroundImage = new Image();
backgroundImage.src = 'BG.png';

const logoImage = new Image();
logoImage.src = 'GVU.png';

function drawWrappedText(ctx, text, centerX, startY, maxWidth, fontSize, color) {
  const words = text.split(/\s+/);
  let line = "";
  let lines = [];

  ctx.fillStyle = color;
  ctx.font = `700 ${fontSize}px Montserrat`;

  for (let word of words) {
    let test = line ? line + " " + word : word;

    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }

  if (line) lines.push(line);

  for (let i = 0; i < lines.length; i++) {
    let w = ctx.measureText(lines[i]).width;
    ctx.fillText(lines[i], centerX - w / 2, startY + i * fontSize * 1.2);
  }
}

function generate() {
  const text = headlineInput.value.trim();
  const template = templateSelect.value;

  if (!text) return;

  newsCtx.clearRect(0, 0, 1080, 1350);

  // Background
  newsCtx.drawImage(backgroundImage, 0, 0, 1080, 1350);

  const img = new Image();
  img.onload = function () {

    // Main image
    newsCtx.drawImage(img, 25, 140, 1030, 720);

    let color = "#000";
    let y = 900;
    let size = 70;

    // TEMPLATE SYSTEM
    if (template === "breaking") {
      newsCtx.fillStyle = "red";
      newsCtx.fillRect(0, 0, 1080, 120);
      color = "#fff";
      y = 880;
    }

    if (template === "dark") {
      newsCtx.fillStyle = "rgba(0,0,0,0.55)";
      newsCtx.fillRect(0, 0, 1080, 1350);
      color = "#fff";
    }

    if (template === "minimal") {
      size = 64;
      y = 930;
    }

    drawWrappedText(newsCtx, text, 540, y, 900, size, color);

    // Logo
    newsCtx.drawImage(logoImage, 930, 40, 120, 120);
  };

  img.src = newsCanvas.toDataURL();
}

generateButton.onclick = generate;

downloadButton.onclick = function () {
  const a = document.createElement('a');
  a.download = "news.png";
  a.href = newsCanvas.toDataURL();
  a.click();
};
</script>

</body>
</html>
