<!DOCTYPE html>
<html>
<head>
  <title>Breaking News Generator</title>
</head>
<body>

<h2>Breaking News Tool</h2>

<input type="file" id="imgInput"><br><br>
<input type="text" id="textInput" placeholder="Enter news text"><br><br>
<button onclick="generate()">Generate</button>

<br><br>
<canvas id="canvas" width="1080" height="1350"></canvas>

<script>
function generate() {
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const imgFile = document.getElementById("imgInput").files[0];
    const text = document.getElementById("textInput").value;

    const reader = new FileReader();

    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {

            // background white
            ctx.fillStyle = "white";
            ctx.fillRect(0,0,1080,1350);

            // breaking red bar
            ctx.fillStyle = "red";
            ctx.fillRect(0,0,1080,120);

            ctx.fillStyle = "white";
            ctx.font = "50px Arial";
            ctx.fillText("BREAKING NEWS", 30, 75);

            // main image
            ctx.drawImage(img, 115, 200, 850, 750);

            // text
            ctx.fillStyle = "black";
            ctx.font = "40px Arial";
            ctx.fillText(text, 50, 1050);
        }
        img.src = e.target.result;
    }

    reader.readAsDataURL(imgFile);
}
</script>

</body>
</html>
